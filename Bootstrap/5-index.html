<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Holberton - Web Stack - Bootstrap</title>
        <meta name="description" content="Bootstrap is a free and open-source CSS framework">

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>
    <body>
        <!-- Shows when screen size < 768px -->
        <h1 class="d-md-none">Small title</h1>
        <!-- Shows when screen size >= 768px -->
        <h1 class="d-none d-md-block">Big title</h1>

        <div class="text-white d-flex justify-content-between mx-auto container-sm-fluid bg-info p-2 border border-info rounded col-lg-11 col-md-11 col-sm-11">
            <div class="text-left border-bottom border-right border-light pr-2 pb-1">Left</div>
            <div class="text-center border-left border-bottom border-right border-light d-none d-md-block pr-1 pl-1 pb-1">Middle</div>
            <div class="text-right border-bottom border-left border-light pl-2 pb-1">Right</div>
        </div>

    </body>
</html>
