<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1</title>
  </head>
  <body>
    <h1>Login to the website</h1>
    <!-- Add two text inputs -->
    <input type="text" placeholder="Firstname" id="firstname" />
    <input type="text" placeholder="Email" id="email" />
    <!-- Login button that calls setCookies() -->
    <button onclick="setCookies()">Log me in</button>
    <h1>Cookies</h1>
    <!-- Button that shows the cookies onClick -->
    <button onclick="showCookies()">Show the cookies</button>
    <script>
      function setCookies() {
        /* Method: Retrieve firstName and email + set cookies */
        const getFirstName = document.getElementById("firstname").value;
        const getEmail = document.getElementById("email").value;

        /* Setting cookies for firstName and email
        Note: Multiple cookies can be set at once,
        and retrieved with one call */
        document.cookie = `firstname=${getFirstName}; path=/`;
        document.cookie = `email=${getEmail}; path=/`;
      }
      function showCookies() {
        /* Method: add new paragraph and append to body with cookies */
        const paragraph = document.createElement("p");
        /* Set the innerHTML of the paragraph */
        paragraph.innerHTML = `Cookies: ${document.cookie}`;
        /* Append paragraph to the body */
        document.body.appendChild(paragraph);
      }
    </script>
  </body>
</html>
