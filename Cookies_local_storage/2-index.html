<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1</title>
  </head>
  <body>
    <h1>Login to the website</h1>
    <input type="text" placeholder="Firstname" id="firstName" />
    <input type="text" placeholder="Email" id="email" />
    <button onclick="setCookies()">Log me in</button>
    <h1>Cookies</h1>
    <button onclick="showCookies()">Show the cookies</button>
    <script>
      function setCookies() {
        /* Method: Retrieve firstName and email + set cookies */
        const firstName = document.getElementById("firstName").value;
        const email = document.getElementById("email").value;

        /* Setting cookies for firstName and email with 10 day expiration date
        Note: Multiple cookies can be set at once, and retrieved with one call */
        document.cookie = `email=${email}; expires=Wed, 16 Apr 2025 12:00:00 UTC`;
        document.cookie = `firstname=${firstName}; expires=Wed, 16 Apr 2025 12:00:00 UTC`;
      }

      function showCookies() {
        /* Method: add new paragraph and append to body with cookies */
        const paragraph = document.createElement("p");
        paragraph.innerHTML = `Email: ${getCookie("email")} - Firstname: ${getCookie("name")}`;
        document.body.appendChild(paragraph);
      }

      function getCookie(name) { /*NEEDS REVIEWED */
        const cookieCheck = document.cookie.split(";");
        for (let x = 0; x < cookieCheck.length; x++) {
          let trimmedCookie = cookieCheck.trim();
          if (trimmedCookie[0] == name) {
            return (trimmedCookie);
          } else {
            return "";
          }
        }
      }
    </script>
  </body>
</html>
