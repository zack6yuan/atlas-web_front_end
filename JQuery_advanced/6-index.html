<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Task 7</title>
  <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
    integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
  <script type="application/javascript">
    $(document).ready(function () {
      function createFamilyTree() {
        $("body").append(
          $("<table>").append(
            $("<thead>").append(
              $("<tr>").append(
                $("<th>").text("Firstname"),
                $("<th>").text("Lastname")
              )
            ),
            $("<tbody>")
          )
        );
      }
      function addNewMember(firstName, lastName, position) {
        const addedRow = $("<tr>").append(
          $("<td>").text(firstName),
          $("<td>").text(lastName),
        );
        $("tbody").append(addedRow);
        if (position === 'before') {
          $("table").prepend(addedRow)
        } else {
          $("table").append(addedRow)
        }
        const newTable = $("<tr>").append(
          $("<tr>").append(
            $("<input>"),
            $("<input>"),
            $("<select>").append(
              $("<option>").attr("value", "before").text("Before"),
              $("<option>").attr("value", "after").text("After"),
            ),
            $("<button>").text("Submit").click(function () {
              addNewMember();
            })
          )
        )
        $("body").prepend(newTable)
      }
      createFamilyTree();
      addNewMember();
    });
  </script>
</head>
<body>
</body>
</html>
