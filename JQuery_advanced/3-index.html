<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Task 0</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8="
      crossorigin="anonymous"
    ></script>
    <script type="application/javascript">
      $(document).ready(function () {
        function createFamilyTree() {
          /* Creating new table using string literal
              Parameters:
              thead - table head
              th - table head (cell)
              tr - table row
              tbody - table body
              td - table data
              */
          $("body").append(
            $("<table>").append(
              $("<thead>").append(
                $("<tr>").append(
                  $("th").text("Firstname"),
                  $("th").text("Lastname")
                )
              ),
              $("<tbody>").append(
                $("<tr>").append(
                  $("td").text("Guillaume"),
                  $("td").text("Salva")
                )
              ),
              $("<tbody>").append(
                $("<tr>").append(
                  $("td").text("Paulette"),
                  $("td").text("Salva")
                )
              ),
              $("<tbody>").append(
                $("<tr>").append(
                  $("td").text("Antoine"),
                  $("td").text("Salva")
                )
              )
            )
          );
        }
        createFamilyTree();
      });
    </script>
  </head>
  <body></body>
</html>
