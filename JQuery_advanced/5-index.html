        <script type="application/javascript">
          $(document).ready(function () {
            function createFamilyTree() {
              /* Creating new table using string literal
              Parameters:
              thead - table head
              th - table head (cell)
              tr - table row
              tbody - table body
              td - table data
              */
              const newTable = `
                <table>
                  <thead>
                    <tr>
                      <th>Firstname</th>
                      <th>Lastname</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>Guillaume</td>
                      <td>Salva</td>
                      <td>(x)</td>
                      $("td").on('click')
                    </tr>
                    <tr>
                      <td>Arielle</td>
                      <td>Snizt</td>
                      <td>(x)</td>
                    </tr>
                    <tr>
                      <td>Fanette</td>
                      <td>Snizt</td>
                      <td>(x)</td>
                    </tr>
                    <tr>
                      <td>Gerard</td>
                      <td>Snizt</td>
                      <td>(x)</td>
                    </tr>
                    <tr>
                      <td>Victor</td>
                      <td>Salva</td>
                      <td>(x)</td>
                    </tr>
                  </tbody>
                </table>
              `;
              /* Append the new table to the body */
              $("body").append(newTable);
            }
            createFamilyTree();
          });
        </script>
    </head>
