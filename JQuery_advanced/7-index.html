    <script type="application/javascript">
      $(document).ready(function () {
        function createSearchForm() {
          $("body").append(
            $("<tr>").append(
              $("<input>").attr("type", "text"),
              $("<input>")
                .attr("type", "submit")
                .click(function () {
                  queryWikipedia();
                })
            )
          );
        }
        function addNewArticle(id, title, snippet) {
          $("body").append(
            $("<table>").append(
              $("<tr>").append(
                $("<td>").append(
                  $("<li>").append(
                    $("<span>").text(/*id*/ "Example ID -"),
                  )
                ),
                $("<td>").append(
                  $("<b>").text(/* title */ "Example Result")
                )
              ),
              $("<tr>").append(
                fetch(`https://www.mediawiki.org/wiki/API:Search`)
                .then(function(response) {return response.json();})
                .then(function(response) {
                  response
                })
              )
            )
          );
        }
        createSearchForm();
        addNewArticle();
      });
    </script>
